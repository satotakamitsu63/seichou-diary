<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f9fbf2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="じゅんひかDiary">
<title>じゅんひかDiary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hedvig+Letters+Serif:opsz@12..24&family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;600&display=swap">
<style>
  /* Design tokens: Ditto (https://styles.refero.design/style/e9001d5a-504d-47ed-aef0-d0d35fa86418) */
  :root {
    --ink: #130e30;
    --slate: #5f5c6e;
    --canvas: #f9fbf2;
    --meadow: #eff2e5;
    --hi-yellow: #ffe228;
    --charcoal: #222222;
    --field: #ffffff;
    --line: #000000;
    --alert: #9c2f21;

    /* Decorative only — child identity markers, never UI accents */
    --jun-mark: #e261e5;
    --hikaru-mark: #59e25d;

    --serif: "Hedvig Letters Serif", "Noto Serif JP", Georgia, serif;
    --sans: "Inter", "Noto Sans JP", system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    letter-spacing: -0.01em;
    min-height: 100vh;
    max-width: 560px;
    margin: 0 auto;
    padding: 28px 16px calc(64px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  [hidden] { display: none !important; }

  :focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }

  .masthead {
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-items: center;
    text-align: center;
  }

  h1 {
    font-family: var(--serif);
    font-size: 32px;
    font-weight: 400;
    line-height: 1.15;
    letter-spacing: -0.32px;
  }

  .meta {
    font-size: 14px;
    line-height: 1.3;
    color: var(--slate);
    letter-spacing: -0.14px;
  }

  .card {
    background: var(--meadow);
    border-radius: 24px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .card-header {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: -0.22px;
  }

  .hint {
    font-size: 14px;
    line-height: 1.5;
    color: var(--slate);
    letter-spacing: -0.02em;
  }

  label { display: flex; flex-direction: column; gap: 6px; }

  .date-row {
    flex-direction: row;
    align-items: center;
    gap: 12px;
  }

  .date-row input { flex: 1; min-width: 0; }

  .label-text {
    font-size: 14px;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--slate);
  }

  input, textarea {
    width: 100%;
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 14px 18px;
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    letter-spacing: -0.01em;
    color: var(--ink);
  }

  input { border-radius: 1440px; }
  textarea { min-height: 150px; resize: vertical; }
  input::placeholder, textarea::placeholder { color: var(--slate); }
  input:focus, textarea:focus { outline: 2px solid var(--ink); outline-offset: -1px; }

  .input-row {
    display: flex;
    gap: 12px;
    align-items: flex-end;
    margin-top: 4px;
  }

  .input-row textarea { flex: 1; min-width: 0; }

  .mic-btn {
    width: 48px;
    height: 48px;
    flex-shrink: 0;
    border: none;
    border-radius: 1440px;
    background: var(--ink);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .mic-btn.recording { animation: ring 1.2s infinite; }

  @keyframes ring {
    0%, 100% { box-shadow: 0 0 0 0 rgba(19, 14, 48, 0.35); }
    50%      { box-shadow: 0 0 0 8px rgba(19, 14, 48, 0); }
  }

  .attach-btn {
    width: 100%;
    padding: 14px 24px;
    border: 1px solid var(--line);
    border-radius: 1440px;
    background: transparent;
    font-family: var(--sans);
    font-size: 16px;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--ink);
    cursor: pointer;
  }

  .attached {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .attached-preview img,
  .attached-preview video {
    width: 100%;
    max-height: 260px;
    object-fit: cover;
    border-radius: 24px;
    display: block;
    background: var(--charcoal);
  }

  .attached-info {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .attached-name {
    font-size: 14px;
    letter-spacing: -0.02em;
    color: var(--slate);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .attached-info .text-btn { align-self: auto; flex-shrink: 0; }

  .entry-media img,
  .entry-media video {
    width: 100%;
    border-radius: 16px;
    display: block;
    background: var(--charcoal);
  }

  .primary-btn {
    width: 100%;
    padding: 16px 24px;
    border: none;
    border-radius: 1440px;
    background: var(--hi-yellow);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    font-weight: 500;
    letter-spacing: -0.02em;
    cursor: pointer;
  }

  .primary-btn:active { transform: translateY(1px); }
  .primary-btn:disabled { background: var(--field); color: var(--slate); cursor: default; }

  .text-btn {
    align-self: center;
    background: none;
    border: none;
    padding: 8px;
    font-family: var(--sans);
    font-size: 14px;
    letter-spacing: -0.02em;
    color: var(--slate);
    text-decoration: underline;
    cursor: pointer;
  }

  #app {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .tabs {
    display: flex;
    gap: 4px;
    background: var(--meadow);
    border-radius: 1440px;
    padding: 4px;
  }

  .tab {
    flex: 1;
    padding: 12px 16px;
    border: none;
    border-radius: 1440px;
    background: transparent;
    font-family: var(--sans);
    font-size: 16px;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--slate);
    cursor: pointer;
  }

  .tab[aria-selected="true"] {
    background: var(--ink);
    color: #fff;
  }

  #panel-diary {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .filters {
    display: flex;
    gap: 8px;
  }

  .filter {
    padding: 8px 18px;
    border: 1px solid var(--line);
    border-radius: 1440px;
    background: transparent;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--ink);
    cursor: pointer;
  }

  .filter[aria-pressed="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: #fff;
  }

  #list {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .day {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .day-title {
    font-family: var(--serif);
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.19px;
    padding-left: 4px;
  }

  .entry {
    background: var(--meadow);
    border-radius: 24px;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .entry-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 1440px;
    background: var(--field);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }

  .mark {
    width: 8px;
    height: 8px;
    border-radius: 1440px;
    flex-shrink: 0;
  }

  .mark-jun    { background: var(--jun-mark); }
  .mark-hikaru { background: var(--hikaru-mark); }

  .entry-note {
    font-size: 16px;
    line-height: 1.6;
  }

  .delete-btn {
    background: none;
    border: none;
    padding: 4px 0;
    font-family: var(--sans);
    font-size: 14px;
    letter-spacing: -0.02em;
    color: var(--slate);
    text-decoration: underline;
    cursor: pointer;
  }

  .confirm {
    background: var(--field);
    border: 1px solid var(--alert);
    border-radius: 24px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .confirm-title {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--alert);
  }

  .confirm-buttons {
    display: flex;
    gap: 12px;
  }

  .confirm-buttons button {
    flex: 1;
    padding: 14px 20px;
    border-radius: 1440px;
    font-family: var(--sans);
    font-size: 16px;
    font-weight: 500;
    letter-spacing: -0.02em;
    cursor: pointer;
  }

  .danger-btn {
    border: none;
    background: var(--alert);
    color: #fff;
  }

  .cancel-btn {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
  }

  .empty {
    background: var(--meadow);
    border-radius: 24px;
    padding: 32px 24px;
    text-align: center;
    font-size: 14px;
    color: var(--slate);
  }

  .toast {
    position: fixed;
    bottom: calc(24px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(140px);
    background: var(--charcoal);
    color: #fff;
    padding: 12px 22px;
    border-radius: 1440px;
    font-size: 14px;
    letter-spacing: -0.02em;
    transition: transform 0.25s;
    z-index: 999;
    max-width: calc(100vw - 32px);
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header class="masthead">
  <h1>じゅんひかDiary</h1>
  <div class="meta" id="meta"></div>
</header>

<form class="card" id="login" hidden>
  <div class="card-header" id="login-title">ログイン</div>
  <p class="hint" id="login-hint">最初の一回だけ。次からはこの端末で開くだけで使えます。</p>
  <label>
    <span class="label-text">メールアドレス</span>
    <input type="email" id="email" autocomplete="username" required>
  </label>
  <label>
    <span class="label-text">パスワード</span>
    <input type="password" id="password" autocomplete="current-password" required>
  </label>
  <button class="primary-btn" id="login-btn" type="submit">ログイン</button>
  <button class="text-btn" id="mode-toggle" type="button">はじめての人はこちら</button>
</form>

<form class="card" id="join" hidden>
  <div class="card-header">合言葉</div>
  <p class="hint">家族の合言葉を入れると、日記を読み書きできるようになります。</p>
  <label>
    <span class="label-text">合言葉</span>
    <input type="text" id="code" autocapitalize="characters" autocomplete="off" required>
  </label>
  <button class="primary-btn" id="join-btn" type="submit">送信する</button>
  <button class="text-btn" id="join-logout" type="button">別のアカウントでログインする</button>
</form>

<main id="app" hidden>
  <div class="tabs" role="tablist">
    <button class="tab" id="tab-write" type="button" role="tab" aria-selected="true">記録する</button>
    <button class="tab" id="tab-diary" type="button" role="tab" aria-selected="false">日記を読む</button>
  </div>

  <section id="panel-write">
    <div class="card">
      <div class="card-header">できごと</div>
      <p class="hint">思いついたまま書いて残してください。日付を変えれば、過去の日の分も登録できます。</p>
      <label class="date-row">
        <span class="label-text">日付</span>
        <input type="date" id="entry-date">
      </label>
      <div class="input-row">
        <textarea id="note" placeholder="例：純と公園に行って砂遊び。すべり台を一人で登れた。帰り道で光が犬を見て「ワンワン」と言えた。"></textarea>
        <button class="mic-btn" id="mic" type="button" title="音声で入力する">🎤</button>
      </div>

      <input type="file" id="media" accept="image/*,video/*" hidden>
      <button class="attach-btn" id="attach" type="button">写真・動画を選ぶ</button>
      <div class="attached" id="attached" hidden>
        <div class="attached-preview" id="attached-preview"></div>
        <div class="attached-info">
          <span class="attached-name" id="attached-name"></span>
          <button class="text-btn" id="attached-remove" type="button">取り消す</button>
        </div>
      </div>

      <button class="primary-btn" id="save" type="button">記録する</button>
    </div>
  </section>

  <section id="panel-diary" hidden>
    <div class="filters" role="group" aria-label="子どもで絞り込む">
      <button class="filter" type="button" data-child="すべて" aria-pressed="true">すべて</button>
      <button class="filter" type="button" data-child="純" aria-pressed="false">純</button>
      <button class="filter" type="button" data-child="光" aria-pressed="false">光</button>
    </div>
    <div id="list"><div class="empty">読み込んでいます…</div></div>
  </section>

  <button class="text-btn" id="logout" type="button">ログアウト</button>
</main>

<div class="toast" id="toast" role="status"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/+esm';

import { MEDIA_PROVIDER } from './media-config.js';
import { createDriveClient } from './drive-client.js';

const SUPABASE_URL = 'https://qkjvdtnjakfqrzgwzexx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_C1CB_8T0U-oaZmfRDqr6Xw_Qb-h9cgm';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const drive = createDriveClient(supabase, `${SUPABASE_URL}/functions/v1/drive-media`, SUPABASE_ANON_KEY);
const driveObjectUrls = new Map();

const el = (id) => document.getElementById(id);
const CHILD_MARK = { '純': 'jun', '光': 'hikaru' };

let recognition = null;
let signingUp = false;
let entries = [];
let pendingDeleteId = null;
let childFilter = 'すべて';
let attachment = null;
let mediaObserver = null;

const BUCKET = 'diary-media';
const MAX_UPLOAD_BYTES = 50 * 1024 * 1024;

// ── Session ───────────────────────────────────────────
el('meta').textContent = new Date().toLocaleDateString('ja-JP',
  { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });

el('entry-date').value = todayKey();
el('entry-date').max = todayKey();

const { data: { session } } = await supabase.auth.getSession();
await showScreen(session);

supabase.auth.onAuthStateChange((_event, next) => { showScreen(next); });

// 日記を読み書きできる人だけが diary_members を読めるので、
// 1行でも返ってくるかどうかが、そのまま合言葉を通ったかどうかになる。
async function isMember() {
  const { data } = await supabase.from('diary_members').select('email').limit(1);
  return Boolean(data && data.length);
}

async function showScreen(session) {
  if (!session) {
    clearDriveMedia();
    entries = [];
    el('list').replaceChildren();
    el('login').hidden = false;
    el('join').hidden = true;
    el('app').hidden = true;
    return;
  }

  const member = await isMember();
  el('login').hidden = true;
  el('join').hidden = member;
  el('app').hidden = !member;
}

el('mode-toggle').addEventListener('click', () => {
  signingUp = !signingUp;
  el('login-title').textContent = signingUp ? 'はじめて使う' : 'ログイン';
  el('login-hint').textContent = signingUp
    ? 'メールアドレスとパスワードを決めてください。このあと合言葉を聞きます。'
    : '最初の一回だけ。次からはこの端末で開くだけで使えます。';
  el('login-btn').textContent = signingUp ? '登録する' : 'ログイン';
  el('mode-toggle').textContent = signingUp ? 'ログインに戻る' : 'はじめての人はこちら';
  el('password').autocomplete = signingUp ? 'new-password' : 'current-password';
});

el('login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = el('login-btn');
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = signingUp ? '登録しています…' : 'ログインしています…';

  const credentials = {
    email: el('email').value.trim(),
    password: el('password').value
  };

  const { error } = signingUp
    ? await supabase.auth.signUp(credentials)
    : await supabase.auth.signInWithPassword(credentials);

  if (error) {
    toast(signingUp
      ? '登録できませんでした。パスワードは6文字以上にしてください'
      : 'メールアドレスかパスワードが違うようです');
  }

  el('password').value = '';
  btn.disabled = false;
  btn.textContent = label;
});

el('join').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = el('join-btn');
  btn.disabled = true;
  btn.textContent = '確認しています…';

  const { data, error } = await supabase.rpc('join_diary', {
    invite_code: el('code').value.trim().toUpperCase()
  });

  if (error || data !== true) {
    toast('合言葉が違うようです');
  } else {
    el('code').value = '';
    const { data: { session } } = await supabase.auth.getSession();
    await showScreen(session);
  }

  btn.disabled = false;
  btn.textContent = '送信する';
});

el('join-logout').addEventListener('click', async () => {
  await supabase.auth.signOut();
});

el('logout').addEventListener('click', async () => {
  await supabase.auth.signOut();
  el('list').innerHTML = '';
});

// ── Tabs ──────────────────────────────────────────────
el('tab-write').addEventListener('click', () => showTab('write'));
el('tab-diary').addEventListener('click', () => showTab('diary'));

function showTab(name) {
  const diary = name === 'diary';
  el('tab-write').setAttribute('aria-selected', String(!diary));
  el('tab-diary').setAttribute('aria-selected', String(diary));
  el('panel-write').hidden = diary;
  el('panel-diary').hidden = !diary;
  window.scrollTo(0, 0);
  if (diary) loadEntries();
}

el('panel-diary').querySelectorAll('.filter').forEach((button) => {
  button.addEventListener('click', () => {
    childFilter = button.dataset.child;
    el('panel-diary').querySelectorAll('.filter').forEach((other) => {
      other.setAttribute('aria-pressed', String(other === button));
    });
    pendingDeleteId = null;
    render(entries);
  });
});

// ── Save ──────────────────────────────────────────────
el('save').addEventListener('click', async () => {
  const note = el('note').value.trim();
  if (!note) {
    toast('今日のできごとを書いてから記録してください');
    return;
  }

  if (recognition) recognition.stop();

  const btn = el('save');
  btn.disabled = true;
  btn.textContent = '保存しています…';

  const entryDate = el('entry-date').value || todayKey();
  let media = null;

  try {
    if (attachment) {
      btn.textContent = attachment.kind === 'video' ? '動画を送っています…' : '写真を送っています…';
      media = await uploadAttachment();

      if (!media) {
        toast('添付を送れませんでした。通信を確認してもう一度お試しください');
        btn.disabled = false;
        btn.textContent = '記録する';
        return;
      }
      btn.textContent = '保存しています…';
    }

    const { error } = await supabase.from('diary_entries').insert({
      entry_date: entryDate,
      note,
      media_path: media?.path ?? null,
      media_type: media?.kind ?? null
    });

    if (error) {
      toast('保存できませんでした。通信を確認してもう一度お試しください');
    } else {
      el('note').value = '';
      attachment = null;
      showAttachment();
      toast(entryDate === todayKey() ? '記録しました' : `${formatDate(entryDate)}の記録を保存しました`);
    }

  } catch (error) {
    toast(error.message || '保存できませんでした。再度お試しください');
  } finally {
    btn.disabled = false;
    btn.textContent = '記録する';
  }
});

async function uploadAttachment() {
  if (attachment.uploaded) return attachment.uploaded;
  if (MEDIA_PROVIDER === 'google-drive') {
    attachment.uploaded = await drive.upload(attachment);
    return attachment.uploaded;
  }
  const extension = attachment.kind === 'video'
    ? (attachment.file.type === 'video/quicktime' ? 'mov' : 'mp4')
    : 'jpg';
  const path = `${crypto.randomUUID()}.${extension}`;

  const { error } = await supabase.storage
    .from(BUCKET)
    .upload(path, attachment.file, { contentType: attachment.file.type || 'image/jpeg' });

  return error ? null : { path, kind: attachment.kind };
}

// ── List ──────────────────────────────────────────────
async function loadEntries() {
  const { data, error } = await supabase
    .from('diary_entries')
    .select('*')
    .order('entry_date', { ascending: false })
    .order('created_at', { ascending: false })
    .limit(200);

  if (error) {
    el('list').innerHTML = '<div class="empty">記録を読み込めませんでした。画面を再読み込みしてください</div>';
    return;
  }

  const rows = data ?? [];
  await attachMediaUrls(rows);
  render(rows);
}

// バケットは非公開なので、表示のたびに期限付きのURLを作る。
async function attachMediaUrls(rows) {
  const paths = rows.filter((row) => row.media_path && !row.media_path.startsWith('drive:')).map((row) => row.media_path);
  if (paths.length === 0) return;

  const { data } = await supabase.storage.from(BUCKET).createSignedUrls(paths, 3600);
  const urls = new Map((data ?? []).map((item) => [item.path, item.signedUrl]));

  for (const row of rows) {
    if (row.media_path && !row.media_path.startsWith('drive:')) row.mediaUrl = urls.get(row.media_path) ?? null;
  }
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !el('panel-diary').hidden) loadEntries();
});

function render(rows) {
  mediaObserver?.disconnect();
  entries = rows;
  const shown = entries.filter(matches);

  if (shown.length === 0) {
    el('list').innerHTML = `<div class="empty">${childFilter === 'すべて'
      ? 'まだ記録がありません。「記録する」から書いてみてください'
      : `${childFilter}の記録はまだありません`}</div>`;
    return;
  }

  el('list').innerHTML = groupByDay(shown).map((day) => `
    <section class="day">
      <h3 class="day-title">${formatDay(day.date)}</h3>
      ${day.items.map(entryCard).join('')}
    </section>
  `).join('');
  mediaObserver = new IntersectionObserver(items => {
    for (const item of items) {
      if (!item.isIntersecting) continue;
      mediaObserver.unobserve(item.target);
      const entry = entries.find(row => row.id === item.target.dataset.id);
      if (entry?.media_type === 'image') displayDriveMedia(item.target, entry);
    }
  });
  el('list').querySelectorAll('[data-action="load-media"]').forEach(button => mediaObserver.observe(button));
}

// 「ふたり」の記録は、どちらの子で絞り込んでも出す。
function matches(entry) {
  if (childFilter === 'すべて') return true;
  return entry.child === childFilter || entry.child === 'ふたり';
}

function groupByDay(rows) {
  const days = [];
  for (const entry of rows) {
    const current = days[days.length - 1];
    if (current && current.date === entry.entry_date) current.items.push(entry);
    else days.push({ date: entry.entry_date, items: [entry] });
  }
  return days;
}

function entryCard(entry) {
  const deleting = entry.id === pendingDeleteId;
  return `
    <article class="entry">
      <div class="entry-head">
        ${chip(entry)}
        ${deleting ? '' : `<button class="delete-btn" type="button" data-action="ask" data-id="${entry.id}">削除</button>`}
      </div>
      <div class="entry-note">${esc(entry.note)}</div>
      ${mediaTag(entry)}
      ${deleting ? confirmPanel(entry) : ''}
    </article>
  `;
}

// 消えた記録は戻らないので、本文を見せたうえで「削除」と打ってもらう。
function confirmPanel(entry) {
  return `
    <div class="confirm">
      <div class="confirm-title">この記録を削除します</div>
      <p class="hint">${formatDate(entry.entry_date)}の記録です。削除すると元に戻せません。消してよければ、下の欄に「削除」と入力してください。</p>
      <input type="text" id="confirm-text" placeholder="削除" autocomplete="off">
      <div class="confirm-buttons">
        <button class="cancel-btn" type="button" data-action="cancel">やめる</button>
        <button class="danger-btn" type="button" data-action="delete" data-id="${entry.id}">削除する</button>
      </div>
    </div>
  `;
}

el('list').addEventListener('click', async (event) => {
  const button = event.target.closest('button[data-action]');
  if (!button) return;

  const { action, id } = button.dataset;

  if (action === 'load-media') {
    await displayDriveMedia(button, entries.find(entry => entry.id === id));
    return;
  }

  if (action === 'ask') {
    pendingDeleteId = id;
    render(entries);
    el('confirm-text').focus();
    return;
  }

  if (action === 'cancel') {
    pendingDeleteId = null;
    render(entries);
    return;
  }

  if (action !== 'delete') return;

  if (el('confirm-text').value.trim() !== '削除') {
    toast('削除するには「削除」と入力してください');
    return;
  }

  button.disabled = true;
  button.textContent = '削除しています…';

  const { error } = await supabase.from('diary_entries').delete().eq('id', id);

  if (error) {
    toast('削除できませんでした。通信を確認してもう一度お試しください');
    button.disabled = false;
    button.textContent = '削除する';
    return;
  }

  // Keep attachment files for recovery; deleting the record must not destroy media first.
  pendingDeleteId = null;
  toast('記録を削除しました。添付ファイルは保存先に残しています');
  loadEntries();
});

async function displayDriveMedia(button, entry) {
  if (!entry) return;
  button.disabled = true;
  button.textContent = '読み込んでいます…';
  try {
    let url = driveObjectUrls.get(entry.media_path);
    if (!url) {
      url = await drive.read(entry.media_path);
      if (el('app').hidden || !button.isConnected) { URL.revokeObjectURL(url); return; }
      driveObjectUrls.set(entry.media_path, url);
    }
    const media = document.createElement(entry.media_type === 'video' ? 'video' : 'img');
    media.src = url;
    if (entry.media_type === 'video') { media.controls = true; media.playsInline = true; }
    else media.alt = '日記に添付した写真';
    button.replaceWith(media);
  } catch (error) {
    button.disabled = false;
    button.textContent = '再読み込み';
    toast(error.message);
  }
}

function clearDriveMedia() {
  mediaObserver?.disconnect();
  for (const url of driveObjectUrls.values()) URL.revokeObjectURL(url);
  driveObjectUrls.clear();
}

function mediaTag(entry) {
  if (!entry.media_path) return '';
  if (entry.media_path.startsWith('drive:')) {
    return `<div class="entry-media" data-drive-id="${entry.id}"><button type="button" class="attach-btn" data-action="load-media" data-id="${entry.id}">${entry.media_type === 'video' ? '動画' : '写真'}を表示</button></div>`;
  }
  if (!entry.mediaUrl) return '<div class="hint">写真を読み込めませんでした</div>';

  return entry.media_type === 'video'
    ? `<div class="entry-media"><video src="${esc(entry.mediaUrl)}" controls preload="metadata"></video></div>`
    : `<div class="entry-media"><img src="${esc(entry.mediaUrl)}" alt="" loading="lazy"></div>`;
}

function chip(entry) {
  if (!entry.sorted) return '<span class="chip">未整理</span>';
  const mark = CHILD_MARK[entry.child];
  const marks = mark
    ? `<span class="mark mark-${mark}"></span>`
    : '<span class="mark mark-jun"></span><span class="mark mark-hikaru"></span>';
  return `<span class="chip">${marks}${esc(entry.child || 'ふたり')}</span>`;
}

// ── Attachment ────────────────────────────────────────
el('attach').addEventListener('click', () => el('media').click());

el('media').addEventListener('change', async () => {
  const file = el('media').files[0];
  el('media').value = '';
  if (!file) return;

  const kind = file.type.startsWith('video/') ? 'video' : 'image';
  const upload = kind === 'image' ? await shrinkImage(file) : file;

  if (upload.size > MAX_UPLOAD_BYTES) {
    toast('50MBを超えるので添付できません。短く撮り直すか写真にしてください');
    return;
  }

  attachment = { file: upload, kind, name: file.name };
  showAttachment();
});

el('attached-remove').addEventListener('click', () => {
  attachment = null;
  showAttachment();
});

function showAttachment() {
  const box = el('attached');
  const preview = el('attached-preview');
  preview.replaceChildren();

  if (!attachment) {
    box.hidden = true;
    el('attach').textContent = '写真・動画を選ぶ';
    return;
  }

  const media = document.createElement(attachment.kind === 'video' ? 'video' : 'img');
  media.src = URL.createObjectURL(attachment.file);
  if (attachment.kind === 'video') media.controls = true;
  preview.append(media);

  el('attached-name').textContent = `${attachment.name}（${fileSize(attachment.file.size)}）`;
  box.hidden = false;
  el('attach').textContent = '別のものに変える';
}

function fileSize(bytes) {
  return bytes < 1024 * 1024
    ? `${Math.max(1, Math.round(bytes / 1024))}KB`
    : `${Math.round(bytes / 1024 / 1024 * 10) / 10}MB`;
}

// 写真はそのままだと1枚数MBになるので、長辺1600pxに縮めてから送る。
// 変換できないときは元のまま送る。
async function shrinkImage(file) {
  try {
    const bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const scale = Math.min(1, 1600 / Math.max(bitmap.width, bitmap.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(bitmap.width * scale);
    canvas.height = Math.round(bitmap.height * scale);
    canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    bitmap.close();

    const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.82));
    return blob && blob.size < file.size ? blob : file;
  } catch {
    return file;
  }
}

// ── Voice input ───────────────────────────────────────
el('mic').addEventListener('click', () => {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    toast('このブラウザでは音声入力を使えません。キーボードで入力してください');
    return;
  }

  if (recognition) {
    recognition.stop();
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = 'ja-JP';
  recognition.continuous = true;
  recognition.interimResults = false;

  el('mic').classList.add('recording');
  el('mic').textContent = '⏹';

  recognition.onresult = (e) => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (!e.results[i].isFinal) continue;
      const text = e.results[i][0].transcript.trim();
      el('note').value = el('note').value ? el('note').value + '\n' + text : text;
    }
  };

  recognition.onerror = (e) => {
    if (e.error === 'aborted' || e.error === 'no-speech') return;
    toast(e.error === 'not-allowed'
      ? 'マイクの使用が許可されていません。ブラウザの設定で許可してください'
      : '音声を聞き取れませんでした。もう一度お試しください');
  };

  recognition.onend = () => {
    el('mic').classList.remove('recording');
    el('mic').textContent = '🎤';
    recognition = null;
  };

  recognition.start();
});

// ── Helpers ───────────────────────────────────────────
function todayKey() {
  return new Date().toLocaleDateString('sv-SE');
}

function formatDay(dateStr) {
  const date = new Date(dateStr + 'T00:00:00');
  const thisYear = date.getFullYear() === new Date().getFullYear();
  return date.toLocaleDateString('ja-JP', thisYear
    ? { month: 'long', day: 'numeric', weekday: 'short' }
    : { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
}

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                  .replace(/"/g, '&quot;').replace(/\n/g, '<br>');
}

let toastTimer = null;
function toast(msg) {
  el('toast').textContent = msg;
  el('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el('toast').classList.remove('show'), 3000);
}
</script>
