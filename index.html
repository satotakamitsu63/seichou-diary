<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f9fbf2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="じゅんひかDiary">
<title>じゅんひかDiary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hedvig+Letters+Serif:opsz@12..24&family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;600&display=swap">
<style>
  /* Design tokens: Ditto (https://styles.refero.design/style/e9001d5a-504d-47ed-aef0-d0d35fa86418) */
  :root {
    --ink: #130e30;
    --slate: #5f5c6e;
    --canvas: #f9fbf2;
    --meadow: #eff2e5;
    --hi-yellow: #ffe228;
    --charcoal: #222222;
    --field: #ffffff;
    --line: #000000;

    /* Decorative only — child identity markers, never UI accents */
    --jun-mark: #e261e5;
    --hikaru-mark: #59e25d;

    --serif: "Hedvig Letters Serif", "Noto Serif JP", Georgia, serif;
    --sans: "Inter", "Noto Sans JP", system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    letter-spacing: -0.01em;
    min-height: 100vh;
    max-width: 560px;
    margin: 0 auto;
    padding: 28px 16px calc(64px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  [hidden] { display: none !important; }

  :focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }

  .masthead {
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-items: center;
    text-align: center;
  }

  h1 {
    font-family: var(--serif);
    font-size: 32px;
    font-weight: 400;
    line-height: 1.15;
    letter-spacing: -0.32px;
  }

  .meta {
    font-size: 14px;
    line-height: 1.3;
    color: var(--slate);
    letter-spacing: -0.14px;
  }

  .card {
    background: var(--meadow);
    border-radius: 24px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .card-header {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: -0.22px;
  }

  .hint {
    font-size: 14px;
    line-height: 1.5;
    color: var(--slate);
    letter-spacing: -0.02em;
  }

  label { display: flex; flex-direction: column; gap: 6px; }

  .label-text {
    font-size: 14px;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--slate);
  }

  input, textarea {
    width: 100%;
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 14px 18px;
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    letter-spacing: -0.01em;
    color: var(--ink);
  }

  input { border-radius: 1440px; }
  textarea { min-height: 150px; resize: vertical; }
  input::placeholder, textarea::placeholder { color: var(--slate); }
  input:focus, textarea:focus { outline: 2px solid var(--ink); outline-offset: -1px; }

  .input-row {
    display: flex;
    gap: 12px;
    align-items: flex-end;
    margin-top: 4px;
  }

  .input-row textarea { flex: 1; min-width: 0; }

  .mic-btn {
    width: 48px;
    height: 48px;
    flex-shrink: 0;
    border: none;
    border-radius: 1440px;
    background: var(--ink);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .mic-btn.recording { animation: ring 1.2s infinite; }

  @keyframes ring {
    0%, 100% { box-shadow: 0 0 0 0 rgba(19, 14, 48, 0.35); }
    50%      { box-shadow: 0 0 0 8px rgba(19, 14, 48, 0); }
  }

  .primary-btn {
    width: 100%;
    padding: 16px 24px;
    border: none;
    border-radius: 1440px;
    background: var(--hi-yellow);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    font-weight: 500;
    letter-spacing: -0.02em;
    cursor: pointer;
  }

  .primary-btn:active { transform: translateY(1px); }
  .primary-btn:disabled { background: var(--field); color: var(--slate); cursor: default; }

  .text-btn {
    align-self: center;
    background: none;
    border: none;
    padding: 8px;
    font-family: var(--sans);
    font-size: 14px;
    letter-spacing: -0.02em;
    color: var(--slate);
    text-decoration: underline;
    cursor: pointer;
  }

  .diary {
    margin-top: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .diary-title {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 400;
    letter-spacing: -0.22px;
  }

  .entry {
    background: var(--meadow);
    border-radius: 24px;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .entry-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .entry-date {
    font-size: 14px;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--slate);
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 1440px;
    background: var(--field);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }

  .mark {
    width: 8px;
    height: 8px;
    border-radius: 1440px;
    flex-shrink: 0;
  }

  .mark-jun    { background: var(--jun-mark); }
  .mark-hikaru { background: var(--hikaru-mark); }

  .field-label {
    font-size: 14px;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--slate);
    margin-bottom: 2px;
  }

  .field-text { font-size: 16px; line-height: 1.5; }

  .empty {
    background: var(--meadow);
    border-radius: 24px;
    padding: 32px 24px;
    text-align: center;
    font-size: 14px;
    color: var(--slate);
  }

  .toast {
    position: fixed;
    bottom: calc(24px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(140px);
    background: var(--charcoal);
    color: #fff;
    padding: 12px 22px;
    border-radius: 1440px;
    font-size: 14px;
    letter-spacing: -0.02em;
    transition: transform 0.25s;
    z-index: 999;
    max-width: calc(100vw - 32px);
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header class="masthead">
  <h1>じゅんひかDiary</h1>
  <div class="meta" id="meta"></div>
</header>

<form class="card" id="login" hidden>
  <div class="card-header">ログイン</div>
  <p class="hint">最初の一回だけ。次からはこの端末で開くだけで使えます。</p>
  <label>
    <span class="label-text">メールアドレス</span>
    <input type="email" id="email" autocomplete="username" required>
  </label>
  <label>
    <span class="label-text">パスワード</span>
    <input type="password" id="password" autocomplete="current-password" required>
  </label>
  <button class="primary-btn" id="login-btn" type="submit">ログイン</button>
</form>

<main id="app" hidden>
  <div class="card">
    <div class="card-header">今日のできごと</div>
    <p class="hint">思いついたまま書いて残してください。したこと・できたこと・覚えたことへの振り分けは、あとでまとめて整理します。</p>
    <div class="input-row">
      <textarea id="note" placeholder="例：純と公園に行って砂遊び。すべり台を一人で登れた。帰り道で光が犬を見て「ワンワン」と言えた。"></textarea>
      <button class="mic-btn" id="mic" type="button" title="音声で入力する">🎤</button>
    </div>
    <button class="primary-btn" id="save" type="button">記録する</button>
  </div>

  <section class="diary">
    <h2 class="diary-title">これまでの記録</h2>
    <div id="list"><div class="empty">読み込んでいます…</div></div>
    <button class="text-btn" id="logout" type="button">ログアウト</button>
  </section>
</main>

<div class="toast" id="toast" role="status"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/+esm';

const SUPABASE_URL = 'https://qkjvdtnjakfqrzgwzexx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_C1CB_8T0U-oaZmfRDqr6Xw_Qb-h9cgm';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const el = (id) => document.getElementById(id);
const CHILD_MARK = { '純': 'jun', '光': 'hikaru' };

let recognition = null;

// ── Session ───────────────────────────────────────────
const { data: { session } } = await supabase.auth.getSession();
showScreen(session);

supabase.auth.onAuthStateChange((_event, next) => showScreen(next));

function showScreen(session) {
  const signedIn = Boolean(session);
  el('login').hidden = signedIn;
  el('app').hidden = !signedIn;
  el('meta').textContent = new Date().toLocaleDateString('ja-JP',
    { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
  if (signedIn) loadEntries();
}

el('login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = el('login-btn');
  btn.disabled = true;
  btn.textContent = 'ログインしています…';

  const { error } = await supabase.auth.signInWithPassword({
    email: el('email').value.trim(),
    password: el('password').value
  });

  if (error) toast('メールアドレスかパスワードが違うようです');
  el('password').value = '';
  btn.disabled = false;
  btn.textContent = 'ログイン';
});

el('logout').addEventListener('click', async () => {
  await supabase.auth.signOut();
  el('list').innerHTML = '';
});

// ── Save ──────────────────────────────────────────────
el('save').addEventListener('click', async () => {
  const note = el('note').value.trim();
  if (!note) {
    toast('今日のできごとを書いてから記録してください');
    return;
  }

  if (recognition) recognition.stop();

  const btn = el('save');
  btn.disabled = true;
  btn.textContent = '保存しています…';

  const { error } = await supabase.from('diary_entries').insert({
    entry_date: todayKey(),
    note
  });

  if (error) {
    toast('保存できませんでした。通信を確認してもう一度お試しください');
  } else {
    el('note').value = '';
    toast('記録しました');
    loadEntries();
  }

  btn.disabled = false;
  btn.textContent = '記録する';
});

// ── List ──────────────────────────────────────────────
async function loadEntries() {
  const { data, error } = await supabase
    .from('diary_entries')
    .select('*')
    .order('entry_date', { ascending: false })
    .order('created_at', { ascending: false })
    .limit(200);

  if (error) {
    el('list').innerHTML = '<div class="empty">記録を読み込めませんでした。画面を再読み込みしてください</div>';
    return;
  }

  render(data ?? []);
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !el('app').hidden) loadEntries();
});

function render(entries) {
  if (entries.length === 0) {
    el('list').innerHTML = '<div class="empty">まだ記録がありません。今日のできごとから書いてみてください</div>';
    return;
  }

  el('list').innerHTML = entries.map((e) => `
    <article class="entry">
      <div class="entry-head">
        <span class="entry-date">${formatDate(e.entry_date)}</span>
        ${chip(e)}
      </div>
      ${e.sorted ? '' : field('メモ', e.note)}
      ${field('したこと', e.shita)}
      ${field('できたこと', e.ieta)}
      ${field('覚えたこと', e.oboeta)}
    </article>
  `).join('');
}

function chip(entry) {
  if (!entry.sorted) return '<span class="chip">未整理</span>';
  const mark = CHILD_MARK[entry.child];
  const marks = mark
    ? `<span class="mark mark-${mark}"></span>`
    : '<span class="mark mark-jun"></span><span class="mark mark-hikaru"></span>';
  return `<span class="chip">${marks}${esc(entry.child || 'ふたり')}</span>`;
}

function field(label, text) {
  if (!text) return '';
  return `<div><div class="field-label">${label}</div><div class="field-text">${esc(text)}</div></div>`;
}

// ── Voice input ───────────────────────────────────────
el('mic').addEventListener('click', () => {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    toast('このブラウザでは音声入力を使えません。キーボードで入力してください');
    return;
  }

  if (recognition) {
    recognition.stop();
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = 'ja-JP';
  recognition.continuous = true;
  recognition.interimResults = false;

  el('mic').classList.add('recording');
  el('mic').textContent = '⏹';

  recognition.onresult = (e) => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (!e.results[i].isFinal) continue;
      const text = e.results[i][0].transcript.trim();
      el('note').value = el('note').value ? el('note').value + '\n' + text : text;
    }
  };

  recognition.onerror = (e) => {
    if (e.error === 'aborted' || e.error === 'no-speech') return;
    toast(e.error === 'not-allowed'
      ? 'マイクの使用が許可されていません。ブラウザの設定で許可してください'
      : '音声を聞き取れませんでした。もう一度お試しください');
  };

  recognition.onend = () => {
    el('mic').classList.remove('recording');
    el('mic').textContent = '🎤';
    recognition = null;
  };

  recognition.start();
});

// ── Helpers ───────────────────────────────────────────
function todayKey() {
  return new Date().toLocaleDateString('sv-SE');
}

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                  .replace(/"/g, '&quot;').replace(/\n/g, '<br>');
}

let toastTimer = null;
function toast(msg) {
  el('toast').textContent = msg;
  el('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el('toast').classList.remove('show'), 3000);
}
</script>
</body>
</html>
